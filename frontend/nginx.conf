server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets de Vite van hasheados por contenido (index-XXXX.js) — cache largo es seguro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html referencia esos hashes: nunca debe quedar cacheado por el navegador,
    # o un rebuild del frontend no se vería reflejado hasta un hard refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
